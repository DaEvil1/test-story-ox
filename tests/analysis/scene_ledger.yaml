# Validation thresholds (consumed by check_story.py)
thresholds:
  min_costs_total: 3          # scenes with cost_paid != none
  min_irreversible_costs: 1
  max_info_overlap: 0.5       # jaccard overlap between any two scenes' new_info
  require_civic_stakes: true  # at least one scene with stakes_scope: civic
