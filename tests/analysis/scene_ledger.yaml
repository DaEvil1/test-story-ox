# Scene Ledger
#
# One entry per scene. Validated by tools/check_story.py (rules SL-*).
# Fields:
#   goal            - what the POV character wants in this scene
#   new_info        - information the READER gains here for the first time
#   value_change    - yes-but | no-and | flat  (try-fail semantics)
#   cost_paid       - what the scene extracts (none if free)
#   irreversible    - true if a cost/door here can never be undone
#   opponent_pressure - none | archive | limit | ari | sera | city
#   stakes_scope    - personal | civic

scenes:
  # Chapter 1
  - {id: ch01-s01, chapter: 1, title: editing-room glitch,
     goal: file the day's work and go home,
     new_info: ["a glitch carries Ira's cadence", "the strip says SOMETHING WAS LEFT BEHIND"],
     value_change: no-and, cost_paid: none, irreversible: false,
     opponent_pressure: archive, stakes_scope: personal}
  - {id: ch01-s02, chapter: 1, title: market wall scrawl,
     goal: steady herself in the market,
     new_info: ["a scoured wall bears Lio's scrawl"],
