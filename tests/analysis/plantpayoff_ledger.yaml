# Plant/Payoff Ledger
#
# Chekhov tracking: everything planted must pay off; everything paid off must
# have been planted. Rules PP-*:
#   PP-01 (error)   - payoff with no plant
#   PP-02 (warning) - plant with no payoff yet (status: needs-payoff)

items:
  - id: PP-coin
    kind: object
    plant: "worn coin with a child's lighthouse, hidden in the niche"
    planted: 2
    payoff: "anchors contact at the table of light (ch7); pressed mark in her palm (ch9-10); kept at the ending (ch11)"
    status: paid

  - id: PP-glitch-ribbon
    kind: object
    plant: "the ribbon/strip carrying Ira's voice — SOMETHING WAS LEFT BEHIND"
    planted: 1
