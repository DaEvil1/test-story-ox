thresholds:
  min_stdev: 1.2            # the curve must actually curve
  min_peak: 8               # climax level
  min_valley: 3             # release level
  min_peak_count: 2         # more than one true high
  min_valley_count: 2       # more than one true low
  max_consecutive_equal: 2  # no three-in-a-row at the same level
  min_distinct_feelings: 6  # the reader must feel more than one thing
