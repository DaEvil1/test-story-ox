# Tension & Feeling Ledger
#
# Per-scene perceived tension (0-10, cold-reader estimate) and the dominant
# reader feeling. Validated by tools/check_story.py (rules TN-*): the curve
# must have shape — peaks, valleys, no long plateaus.

scenes:
  - {id: ch01-s01, tension: 5, feeling: unease}
  - {id: ch01-s02, tension: 4, feeling: sorrow}
  - {id: ch01-s03, tension: 5, feeling: dread}
