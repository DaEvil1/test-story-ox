# Ambiguity Ledger
#
# For each deliberately unresolved question, evidence for rival readings.
# A reading with fewer than min_evidence items fails the build (rule AM-01):
# ambiguity must be productive (both readings rich), not evasion.

questions:
  - id: q1
    question: Why did Ira authorize the erasure of Lio?
    resolution: deliberately-unresolved
    readings:
      mercy:
        - "an earlier take surfaces in the record — 'There has to be another way to—' — before the decided directive (ch4)"
        - "a small lighthouse sketched beside Ira's signature, unhurried, almost tender (ch5)"
        - "the sealing door's pressure felt like 'a hand laying something down', not punishment (ch10)"
        - "the glitch is Ira's own recording, smuggled where erasure could not reach — left for Keji to find (ch10)"
      betrayal:
        - "the resumed voice is flat, careful, decided: 'necessary' (ch4)"
        - "'The child becomes a ledger entry' — a person converted to paperwork (ch4, ch7)"
        - "Ari: she made a choice; he will not judge whether it was right (ch5)"
        - "'Something was left behind. On purpose.' — deliberateness confessed in the cut-off line (ch10)"
    min_evidence_per_reading: 2

  - id: q2
    question: What is The Limit — person, system, or pattern?
    resolution: deliberately-unresolved
    readings:
      person_or_voice:
        - "speaks in Ira's cadence through the Archive (ch7)"
        - "whispers 'necessary' with the catch she knows (ch4)"
        - "Ari: 'There are voices in the record that are not ours. The Limit is one of them.' (ch5)"
      pattern_or_system:
        - "'no further' resets walls and seals doors without words (ch2, ch4)"
        - "Sera: 'It's the thing the city does when it decides you're asking for too much.' (ch3)"
        - "pressure and temperature shifts obey policy-like rules (ch6, ch9)"
    min_evidence_per_reading: 2

  - id: q3
    question: What happened to Lio — dead, erased, or translated into the Archive?
    resolution: deliberately-unresolved
    readings:
      destroyed:
        - "'The child is not lost. The child becomes a ledger entry.' (ch4)"
        - "the morning Lio was gone; sealed records (ch1)"
      preserved_elsewhere:
        - "the child's line survives intact in the node: 'if I keep the light...' (ch4, ch7)"
        - "the private ledger keeps the entry; the city knows it exists (ch11)"
    min_evidence_per_reading: 2

  - id: q4
    question: Are Keji's remembered scenes (tidepool, kitchen, coin ceremony) authentic?
    resolution: deliberately-unresolved
    readings:
      authentic:
        - "her body carries physical corroboration: the coin's pressed mark, the bandaged fingers (ch9-ch10)"
        - "she avoided her own archive for years — the opposite of curating a comfortable self (ch1)"
      edited:
        - "Sera: 'Yours, by you' — editors are uniquely positioned to edit themselves (ch11)"
        - "the glitch lived inside her own archive unnoticed; what else could be living there? (ch1)"
    min_evidence_per_reading: 2
