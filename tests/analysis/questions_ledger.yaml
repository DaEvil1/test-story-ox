# Open-Loops (Reader Questions) Ledger
#
# Questions the text raises in the reader's mind: when opened, when closed or
# deliberately held, and where long-running loops get reminder beats.
# Rules QL-*: attention is a budget; loops must be managed.

loops:
  - id: RQ1
    question: What is the glitch, and whose voice is in it?
    opened: 1
    closed: 10
    status: answered
    reminders: [2, 5]

  - id: RQ2
    question: What happened to Lio, and why did Ira sign for it?
    opened: 1
    status: held-deliberate
    reminders: [3, 4, 5, 7, 10]
    # One loop in the reader's mind with two facets (the event; the motive).
    # Both facets stay deliberately unresolved.

  - id: RQ3
    question: What is The Limit — person, system, or pattern?
    opened: 1
    status: held-deliberate
    reminders: [3, 6, 7, 9, 10]

  - id: RQ5
    question: What has Ari himself done — did he touch the sealed record?
    opened: 3
    status: held-deliberate
    reminders: [5, 8]

  - id: RQ6
    question: What does the Archive itself want?
    opened: 2
    closed: 10
    status: answered
    reminders: [4, 6]
    # Answered by enforcement behavior: it seals the node, spares the public
    # surface, takes a hand for forcing — balance and self-preservation, shown
    # not told (ch9-ch10).

  - id: RQ7
    question: Why does Sera live in the Drift?
    opened: 5
    closed: 10
    status: answered
    reminders: []

thresholds:
  max_simultaneously_open: 6
  max_open_chapters_without_reminder: 5   # a loop open longer than this needs a reminder within the window
