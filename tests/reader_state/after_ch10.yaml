chapter_read: 10
believes_happened:
  - "The node is sealed permanently — 'the way a grave is sealed: not locked, just finished.' The maintenance key hangs pointless at a door with no inside"
  - "A Drift wall burst and poured a decades-gone woman's voice into a passerby — uncuration shown as real harm; the Curators could fix him 'and take the voice with it'"
  - "Sera's history: they gave her a grief edit once, six smooth weeks — she came back down the day she could walk. 'I wanted the rough parts back. They were his.'"
  - "THE RIBBON PLAYED END TO END: kitchen sounds, Ira laughing, Keji's sleepy voice — then in the pause where Ira thought the recorder was off: 'Something was left behind. On purpose. You'll know it when—' Cut clean."
  - "She wound the ribbon around her fingers tighter than good without deciding to"
trust:
  - "Sera fully now — wound revealed"
  - "Ira: mercy-evidence strengthened but purpose still dark"
keji_wants: "to carry it right — the amendment route feels inevitable now"
ira_status_belief: "the glitch was Ira's own smuggled recording, planted where erasure couldn't reach. Deliberate beacon. Whether confession, apology, or instruction — unknowable from four words"
limit_belief: "it let the man go gently. It lays things down rather than punishing — the sealing felt like 'a hand laying something down'"
questions_holding:
  - "What would 'you'll know it when—' have finished with?"
  - "Does the council/Curator apparatus already sense the amendment coming?"
predictions_next:
  - "She writes the amendment next — administrative correction, plaque, private ledger retained"
  - "Ari is implicated in helping and will be exposed to risk"
confused_by:
  - "nothing — clearest chapter yet"
emotionally_strongest: "'The message had been in her pocket through every sealed door.'"
seems_like_foreshadowing:
  - "the morning-bell procedure hasn't appeared but bureaucracy will answer"
fuzzy_or_forgotten:
  - "street names the dead woman spoke"
